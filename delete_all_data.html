<!DOCTYPE html>
<html>
<head>
  <title>ScoutX — Delete All Data</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    h1 { color: #c62828; }
    button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #c62828; color: white; border: none; border-radius: 8px; }
    button:hover { background: #b71c1c; }
    button:disabled { background: #999; cursor: not-allowed; }
    #log { margin-top: 20px; padding: 16px; background: #f5f5f5; border-radius: 8px; max-height: 500px; overflow-y: auto; font-family: monospace; font-size: 13px; white-space: pre-wrap; }
    .done { color: #2e7d32; font-weight: bold; }
    .err { color: #c62828; }
  </style>
</head>
<body>
  <h1>ScoutX — Delete All Data</h1>
  <p>This will permanently delete <strong>ALL</strong> documents from every Firestore collection.</p>
  <p>Collections: users, clips, likes, follows, saved_clips, clip_comments, conversations, messages, openings, trials, trial_applications, reports</p>
  <button id="btn" onclick="deleteAll()">DELETE EVERYTHING</button>
  <div id="log"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBWqmfIKz9sn77MP4ok0GSIL_GreknoxmY",
      authDomain: "scoutx-ed075.firebaseapp.com",
      projectId: "scoutx-ed075",
      storageBucket: "scoutx-ed075.firebasestorage.app",
      messagingSenderId: "353251846505",
      appId: "1:353251846505:web:716bc681127a5c364ef5f8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const log = document.getElementById("log");

    function appendLog(msg, cls) {
      const span = document.createElement("span");
      if (cls) span.className = cls;
      span.textContent = msg + "\n";
      log.appendChild(span);
      log.scrollTop = log.scrollHeight;
    }

    window.deleteAll = async function() {
      const btn = document.getElementById("btn");
      btn.disabled = true;
      btn.textContent = "Deleting...";

      const collections = [
        "users", "clips", "likes", "follows", "saved_clips",
        "clip_comments", "conversations", "messages",
        "openings", "trials", "trial_applications", "reports"
      ];

      let totalDeleted = 0;

      for (const colName of collections) {
        try {
          const snap = await getDocs(collection(db, colName));
          if (snap.empty) {
            appendLog(`${colName}: already empty`);
            continue;
          }
          appendLog(`${colName}: ${snap.size} documents found...`);
          for (const d of snap.docs) {
            await deleteDoc(doc(db, colName, d.id));
            totalDeleted++;
          }
          appendLog(`${colName}: deleted ${snap.size} documents ✓`);
        } catch (e) {
          appendLog(`${colName}: ERROR - ${e.message}`, "err");
        }
      }

      appendLog(`\nDone! Total deleted: ${totalDeleted} documents`, "done");
      btn.textContent = "DONE — All data deleted";
    };
  </script>
</body>
</html>
